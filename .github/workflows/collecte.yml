# Collecte automatique des offres d'alternance, chaque heure.
# Bouton manuel : onglet « Actions » du dépôt > « Collecte des offres » > « Run workflow ».
name: Collecte des offres

on:
  schedule:
    - cron: "17 * * * *" # chaque heure à hh:17 (heure UTC), pour éviter l'heure pile, très chargée
  workflow_dispatch: # bouton « Run workflow »

# Une seule collecte à la fois : la suivante attend que la précédente finisse.
concurrency:
  group: collecte
  cancel-in-progress: false

# Le robot peut seulement lire le code (moindre privilège).
permissions:
  contents: read

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Lancer les tests (on s'arrête s'ils échouent)
        run: node --test "scripts/**/*.test.ts" "src/**/*.test.ts"

      - name: Collecter les offres
        run: node scripts/collecte/index.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LBA_API_TOKEN: ${{ secrets.LBA_API_TOKEN }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          # Adzuna : quota gratuit inconnu → 10 appels toutes les 4 heures (~60/jour, ~1 800/mois).
          ADZUNA_TOUTES_LES_N_HEURES: "4"
          ADZUNA_PAGES_MAX: "10"
          ADZUNA_JOURS: "1"
